{% extends 'base.html' %}
{% block title %}Setări Firmă – ALIDEEA{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3 gap-2">
    <a href="{{ url_for('financiar.index') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
    <h4 class="mb-0"><i class="bi bi-building me-2 text-primary"></i>Date Firmă (pe facturi)</h4>
</div>
<div class="card border-0 shadow-sm" style="max-width:600px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Denumire firmă</label>
                <input type="text" name="firma_nume" class="form-control" value="{{ setari.get('firma_nume','') }}">
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">CUI</label>
                    <input type="text" name="firma_cui" class="form-control" value="{{ setari.get('firma_cui','') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Reg. Com.</label>
                    <input type="text" name="firma_reg_com" class="form-control" value="{{ setari.get('firma_reg_com','') }}">
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label fw-semibold">Adresă</label>
                <input type="text" name="firma_adresa" class="form-control" value="{{ setari.get('firma_adresa','') }}">
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Telefon</label>
                    <input type="text" name="firma_telefon" class="form-control" value="{{ setari.get('firma_telefon','') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="firma_email" class="form-control" value="{{ setari.get('firma_email','') }}">
                </div>
            </div>
            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Bancă</label>
                    <input type="text" name="firma_banca" class="form-control" value="{{ setari.get('firma_banca','') }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">IBAN</label>
                    <input type="text" name="firma_iban" class="form-control" value="{{ setari.get('firma_iban','') }}">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvează</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
