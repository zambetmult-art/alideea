{% extends "base.html" %}
{% block title %}{{ 'Editeaza Firma' if firma else 'Firma Noua' }}{% endblock %}
{% block content %}
<div class="page-header">
    <h4><i class="bi bi-building me-2 text-primary"></i>{{ 'Editeaza Firma' if firma else 'Firma Noua' }}</h4>
</div>
<div class="card" style="max-width:600px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Numele Firmei *</label>
                <input type="text" name="nume" class="form-control"
                       value="{{ firma.nume if firma else '' }}" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">CUI / Cod Fiscal</label>
                <div class="input-group">
                    <input type="text" name="cui" id="inputCui" class="form-control"
                           value="{{ firma.cui if firma else '' }}" placeholder="ex: RO12345678">
                    <button type="button" class="btn btn-outline-secondary" id="btnAnaf" title="Cauta in ANAF">
                        <i class="bi bi-search me-1"></i>ANAF
                    </button>
                </div>
                <div id="anafResult" class="mt-1 small text-muted"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Website</label>
                <input type="url" name="website" class="form-control"
                       value="{{ firma.website if firma else '' }}" placeholder="https://...">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Descriere / Observatii</label>
                <textarea name="descriere" class="form-control" rows="3">{{ firma.descriere if firma else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Salveaza
                </button>
                <a href="/concurenta/" class="btn btn-outline-secondary">Anuleaza</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('btnAnaf').addEventListener('click', function() {
    const cui = document.getElementById('inputCui').value.trim();
    if (!cui) { alert('Introdu CUI-ul mai intai.'); return; }
    const div = document.getElementById('anafResult');
    div.textContent = 'Se cauta...';
    fetch('/concurenta/api/anaf/' + encodeURIComponent(cui))
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                document.querySelector('[name="nume"]').value = data.nume || '';
                div.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Gasit: ' + data.adresa + '</span>';
            } else {
                div.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>' + data.msg + '</span>';
            }
        })
        .catch(() => { div.textContent = 'Eroare conexiune ANAF.'; });
});
</script>
{% endblock %}
