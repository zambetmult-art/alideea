{% extends "base.html" %}
{% block title %}Se repornește...{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="spinner-border text-warning mb-3" style="width:3rem;height:3rem;" role="status"></div>
    <h4>Flask se repornește...</h4>
    <p class="text-muted">Watchdog-ul va reporni aplicația în câteva secunde.<br>
    Pagina se va reîncărca automat.</p>
    <div class="mt-3">
        <a href="/" class="btn btn-outline-primary btn-sm">Încearcă acum</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
// Incearca sa reajunga la pagina principala la fiecare 3 secunde
let attempts = 0;
function tryReload() {
    attempts++;
    if (attempts > 20) return; // max 60 sec
    fetch('/').then(r => {
        if (r.ok) { window.location = '/'; }
        else { setTimeout(tryReload, 3000); }
    }).catch(() => setTimeout(tryReload, 3000));
}
setTimeout(tryReload, 5000);
</script>
{% endblock %}
